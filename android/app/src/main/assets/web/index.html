<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaaLow Teaching</title>
<style>
  :root { --bg:#16181d; --panel:#1f2229; --line:#2e323b; --text:#e6e6e6; --dim:#8a8f99; --accent:#e0b34a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui, "Microsoft YaHei", sans-serif;
         display:flex; height:100vh; }
  #left { flex:1; display:flex; flex-direction:column; min-width:0; padding:10px; gap:8px; }
  #tools { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  #tools button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px;
                  padding:5px 10px; cursor:pointer; }
  #tools button.on { border-color:var(--accent); color:var(--accent); }
  #tools .sep { width:1px; height:22px; background:var(--line); margin:0 4px; }
  #tools #shot { border-color:var(--accent); }
  #info { margin-left:auto; color:var(--dim); font-variant-numeric:tabular-nums; }
  #stage { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; position:relative; }
  canvas { max-width:100%; max-height:100%; cursor:crosshair; border:1px solid var(--line); touch-action:none; }
  #empty { position:absolute; color:var(--dim); pointer-events:none; }
  #right { width:380px; display:flex; flex-direction:column; border-left:1px solid var(--line); background:var(--panel); }
  #head { padding:10px 12px; border-bottom:1px solid var(--line); color:var(--dim); }
  #log { flex:1; overflow-y:auto; padding:10px 12px; display:flex; flex-direction:column; gap:10px; }
  .msg { padding:8px 10px; border-radius:8px; white-space:pre-wrap; word-break:break-word; }
  .msg.teacher { background:#2b3342; align-self:flex-end; max-width:90%; }
  .msg.ai { background:#2a2d24; border-left:3px solid var(--accent); }
  .msg .meta { font-size:12px; color:var(--dim); margin-bottom:2px; }
  .msg img { max-width:100%; margin-top:6px; border-radius:4px; cursor:zoom-in; }
  #compose { border-top:1px solid var(--line); padding:10px 12px; display:flex; flex-direction:column; gap:6px; }
  #text { width:100%; height:80px; resize:vertical; background:var(--bg); color:var(--text); border:1px solid var(--line);
          border-radius:6px; padding:6px 8px; font:inherit; }
  #send { background:var(--accent); color:#1a1a1a; border:0; border-radius:6px; padding:7px; font-weight:600; cursor:pointer; }
  #hint { font-size:12px; color:var(--dim); }
  #status { font-size:12px; color:var(--dim); margin-left:6px; }
  #status.away { color:#ff7875; }
  #thinking { display:none; color:var(--accent); font-size:13px; }
  #thinking a { color:var(--dim); margin-left:8px; cursor:pointer; text-decoration:underline; }
  #compose.locked #text, #compose.locked #send { opacity:.45; pointer-events:none; }
  @keyframes pulse { 50% { opacity:.4; } }
  #thinking span { animation: pulse 1.2s infinite; }
  .msg.ai.auto { background:transparent; border-left-color:var(--line); color:var(--dim); font-size:12px; padding:2px 10px; }
  @media (max-width: 900px) { body { flex-direction:column; } #right { width:auto; height:45vh; border-left:0; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<div id="left">
  <div id="tools">
    <button id="shot" title="S">📷 截图</button>
    <span class="sep"></span>
    <button data-tool="rect" title="1">▭ 框选</button>
    <button data-tool="circle" title="2">◯ 圈</button>
    <button data-tool="arrow" title="3">➔ 箭头</button>
    <button data-tool="click" title="4">✚ 点击点</button>
    <button data-tool="region" title="5">⬚ 区域</button>
    <span class="sep"></span>
    <button id="undo" title="Ctrl+Z">撤销</button>
    <button id="clear">清空</button>
    <span id="info"></span>
  </div>
  <div id="stage"><canvas id="cv" width="1080" height="720"></canvas><div id="empty">点“截图”获取当前画面</div></div>
</div>
<div id="right">
  <div id="head">MaaLow 教学 · <span id="task"></span><span id="status"></span></div>
  <div id="log"></div>
  <div id="compose">
    <div id="thinking"><span>MaaLow 思考中…</span> <b id="elapsed"></b><a id="force">仍要发送</a></div>
    <textarea id="text" placeholder="告诉 MaaLow 做什么，例如：点 1 号框里的按钮"></textarea>
    <button id="send">发送（Ctrl+Enter）</button>
    <div id="hint">先截图再标注；标注会编号，文字里可以直接说“1 号”“2 号”。快捷键 S 截图，1–5 切换工具。</div>
  </div>
</div>
<script>
const TOKEN = new URLSearchParams(location.search).get("token") || localStorage.getItem("maalow-token") || "";
if (TOKEN) localStorage.setItem("maalow-token", TOKEN);
const API = "/api/v1";
const api = (path, opts = {}) =>
  fetch(API + path, { ...opts, headers: { ...(opts.headers || {}), Authorization: "Bearer " + TOKEN } });
const json = async (path, opts) => { const r = await api(path, opts); if (!r.ok) throw new Error(await r.text()); return r.json(); };
const post = (path, body) => json(path, { method: "POST", body: JSON.stringify(body || {}) });
let workspace = "";
const fileUrl = p => `${API}/files/${encodeURIComponent(workspace)}/${p}?token=${encodeURIComponent(TOKEN)}`;

const COLORS = { rect:"#ff4d4f", circle:"#40a9ff", arrow:"#52c41a", click:"#faad14", region:"#b37feb" };
const NAMES = { rect:"框选", circle:"圈", arrow:"箭头", click:"点击点", region:"区域" };
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let tool = "rect", marks = [], draft = null, img = new Image(), shot = "", seen = 0;

function setTool(t) {
  tool = t;
  document.querySelectorAll("[data-tool]").forEach(b => b.classList.toggle("on", b.dataset.tool === t));
}
document.querySelectorAll("[data-tool]").forEach(b => b.onclick = () => setTool(b.dataset.tool));
setTool("rect");

function pos(e) {
  const r = cv.getBoundingClientRect();
  return [Math.round((e.clientX - r.left) * cv.width / r.width), Math.round((e.clientY - r.top) * cv.height / r.height)];
}

// coords follow maalow.teaching.Annotation: rect/region/circle [x,y,w,h], arrow [x1,y1,x2,y2], click [x,y]
function toMark(kind, a, b) {
  if (kind === "click") return { kind, coords: b };
  if (kind === "arrow") return { kind, coords: [a[0], a[1], b[0], b[1]] };
  return { kind, coords: [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.abs(b[0] - a[0]), Math.abs(b[1] - a[1])] };
}

function drawMark(m, n) {
  const c = COLORS[m.kind], [x, y, w, h] = m.coords;
  ctx.strokeStyle = c; ctx.fillStyle = c; ctx.lineWidth = 3;
  ctx.setLineDash(m.kind === "region" ? [8, 6] : []);
  let lx = x, ly = y;
  if (m.kind === "rect" || m.kind === "region") ctx.strokeRect(x, y, w, h);
  else if (m.kind === "circle") {
    ctx.beginPath(); ctx.ellipse(x + w / 2, y + h / 2, Math.max(w / 2, 1), Math.max(h / 2, 1), 0, 0, 2 * Math.PI); ctx.stroke();
  } else if (m.kind === "arrow") {
    const [x2, y2] = [w, h], ang = Math.atan2(y2 - y, x2 - x);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - 16 * Math.cos(ang - 0.4), y2 - 16 * Math.sin(ang - 0.4));
    ctx.lineTo(x2 - 16 * Math.cos(ang + 0.4), y2 - 16 * Math.sin(ang + 0.4));
    ctx.closePath(); ctx.fill();
  } else if (m.kind === "click") {
    ctx.beginPath(); ctx.arc(x, y, 10, 0, 2 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 16, y); ctx.lineTo(x + 16, y); ctx.moveTo(x, y - 16); ctx.lineTo(x, y + 16); ctx.stroke();
    lx = x + 12; ly = y - 12;
  }
  ctx.setLineDash([]);
  if (n) {
    ctx.font = "bold 16px sans-serif";
    const t = String(n), tw = ctx.measureText(t).width + 8;
    ctx.fillRect(lx, ly - 20, tw, 20);
    ctx.fillStyle = "#000"; ctx.fillText(t, lx + 4, ly - 4);
  }
}

function render() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (img.complete && img.naturalWidth) ctx.drawImage(img, 0, 0);
  marks.forEach((m, i) => drawMark(m, i + 1));
  if (draft) drawMark(draft, 0);
  document.getElementById("empty").style.display = shot ? "none" : "block";
}

// pointer events: mouse, pen and touch (the page may be opened on the tablet itself)
let start = null;
cv.onpointerdown = e => {
  if (!shot) return;
  cv.setPointerCapture(e.pointerId);
  start = pos(e);
  if (tool === "click") { marks.push(toMark("click", start, start)); start = null; render(); }
};
cv.onpointermove = e => {
  const p = pos(e);
  document.getElementById("info").textContent = `(${p[0]}, ${p[1]})  ${cv.width}×${cv.height}`;
  if (start) { draft = toMark(tool, start, p); render(); }
};
cv.onpointerup = e => {
  if (!start) return;
  const m = toMark(tool, start, pos(e));
  start = null; draft = null;
  const tiny = m.kind === "arrow" ? Math.hypot(m.coords[2] - m.coords[0], m.coords[3] - m.coords[1]) < 5 : m.coords[2] < 4 || m.coords[3] < 4;
  if (!tiny) marks.push(m);
  render();
};
cv.onpointercancel = () => { start = null; draft = null; render(); };
document.getElementById("undo").onclick = () => { marks.pop(); render(); };
document.getElementById("clear").onclick = () => { marks = []; render(); };

// A screenshot is a saved workspace file; marks are drawn on it and sent with its path.
function show(path) {
  const next = new Image();
  next.onload = () => { img = next; shot = path; cv.width = next.naturalWidth; cv.height = next.naturalHeight; render(); };
  next.src = fileUrl(path);
}

let shooting = false;
async function takeShot() {
  if (shooting) return;
  shooting = true;
  const b = document.getElementById("shot");
  b.textContent = "📷 截图中…";
  try {
    const s = await post("/shot");
    workspace = s.workspace;
    marks = [];
    show(s.screenshot);
  } catch (e) {
    alert("截图失败：" + e.message);
  } finally {
    shooting = false;
    b.textContent = "📷 截图";
  }
}
document.getElementById("shot").onclick = takeShot;

// the AI acted: show its new screenshot, unless the teacher is in the middle of drawing
function followShot(path) {
  if (path && path !== shot && !marks.length && !start) show(path);
}

function addMsg(m) {
  const d = document.createElement("div");
  d.className = "msg " + m.role + (m.auto ? " auto" : "");
  d.innerHTML = `<div class="meta">${m.role === "ai" ? "MaaLow" : "你"} · ${m.time}</div>`;
  d.appendChild(document.createTextNode(m.text || ""));
  if (m.note) {
    const i = document.createElement("img");
    i.src = fileUrl(m.note); i.onclick = () => window.open(i.src);
    d.appendChild(i);
  }
  const log = document.getElementById("log");
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}

let task = "";
async function poll() {
  try {
    const s = await json("/state");
    if (s.task !== task || s.workspace !== workspace) {  // new session: reload its chat
      task = s.task; workspace = s.workspace; seen = 0;
      document.getElementById("log").innerHTML = "";
    }
    document.getElementById("task").textContent = `${s.workspace} · 任务 ${s.task} · 第 ${s.steps} 步`;
    followShot(s.screenshot);
    setWaiting(s.waiting);
    const st = document.getElementById("status");
    st.textContent = { listening: " · MaaLow 在线", busy: " · MaaLow 处理中", away: " · MaaLow 未在监听，消息会排队" }[s.ai] || "";
    st.className = s.ai === "away" ? "away" : "";
    const ms = await json("/messages?since=" + seen);
    ms.forEach(addMsg); seen += ms.length;
  } catch (e) { /* app restarting */ }
}
setInterval(poll, 1500); poll();

// lock the composer from sending until the AI answers, so instructions are not repeated
let waitingSince = 0, forced = false;
function setWaiting(w) {
  if (w && !waitingSince) waitingSince = Date.now();
  if (!w) { waitingSince = 0; forced = false; }
  const locked = w && !forced;
  document.getElementById("compose").classList.toggle("locked", locked);
  document.getElementById("thinking").style.display = locked ? "block" : "none";
  const secs = waitingSince ? Math.round((Date.now() - waitingSince) / 1000) : 0;
  document.getElementById("elapsed").textContent = secs + " 秒";
  document.getElementById("force").style.display = secs >= 60 ? "inline" : "none";
}
document.getElementById("force").onclick = () => { forced = true; setWaiting(true); };
setInterval(() => { if (waitingSince) setWaiting(true); }, 1000);

let sending = false;
async function send() {
  const text = document.getElementById("text").value.trim();
  if (sending || (!text && !marks.length)) return;
  if (document.getElementById("compose").classList.contains("locked")) return;
  sending = true;
  try {
    const labeled = marks.map((m, i) => ({ ...m, label: `${i + 1}号${NAMES[m.kind]}` }));
    const image = marks.length ? cv.toDataURL("image/png") : "";
    await post("/teach", { text, annotations: labeled, image, screenshot: shot });
    document.getElementById("text").value = ""; marks = []; render();
    forced = false; setWaiting(true); poll();
  } catch (e) {
    alert("发送失败：" + e.message);
  } finally {
    sending = false;
  }
}
document.getElementById("send").onclick = send;
document.getElementById("text").onkeydown = e => {
  if (e.key === "Enter" && e.ctrlKey && !e.repeat && !e.isComposing) { e.preventDefault(); send(); }
};
window.onkeydown = e => {
  if (e.target.tagName === "TEXTAREA") return;
  const t = ["rect", "circle", "arrow", "click", "region"][Number(e.key) - 1];
  if (t) setTool(t);
  if (e.key === "s" || e.key === "S") takeShot();
  if (e.key === "z" && e.ctrlKey) { marks.pop(); render(); }
};
render();
</script>
</body>
</html>
