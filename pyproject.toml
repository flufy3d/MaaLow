[project]
name = "maalow"
version = "0.1.0"
description = "Teachable Low-Code Automation on MaaFramework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
maa = ["maafw"]

[project.scripts]
maalow = "maalow.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maalow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
